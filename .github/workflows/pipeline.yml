name: RPG

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  analyse-code:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Téléchargement du code source
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Détection de secrets dans le code
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload rapport Gitleaks vers l'onglet Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4.36.2
        with:
          sarif_file: results.sarif
          category: gitleaks

      - name: Installation de Cppcheck
        run: sudo apt-get install -y cppcheck

      - name: Recherche de bugs dans le code C++
        run: |
          cppcheck \
            --enable=warning,portability \
            --suppress=missingIncludeSystem \
            --error-exitcode=1 \
            rpg-source/

  scan-jeu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Téléchargement du code source
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Construction de l'image du jeu
        run: docker build -t rpg-alterdune .

      - name: Scan de vulnérabilités du jeu
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rpg-alterdune
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: 1
          format: sarif
          output: trivy-jeu.sarif

      - name: Upload du rapport vers l'onglet Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4.36.2
        with:
          sarif_file: trivy-jeu.sarif
          category: trivy-jeu

  build-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Téléchargement du code source
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Construction de l'image de l'API
        run: docker build -t rpg-api:ci -f rpg-api/Dockerfile .

      - name: Export de l'image
        run: docker save rpg-api:ci -o rpg-api.tar

      - name: Partage de l'image avec les autres jobs
        uses: actions/upload-artifact@v7
        with:
          name: image-rpg-api
          path: rpg-api.tar
          retention-days: 1

  scan-api:
    needs: build-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Récupération de l'image de l'API
        uses: actions/download-artifact@v8
        with:
          name: image-rpg-api

      - name: Chargement de l'image
        run: docker load -i rpg-api.tar

      - name: Scan de vulnérabilités de l'API
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rpg-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: 1
          format: sarif
          output: trivy-api.sarif

      - name: Upload du rapport vers l'onglet Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4.36.2
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api

  sast-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Téléchargement du code source
        uses: actions/checkout@v7

      - name: Analyse Bandit (vulnérabilités Python)
        run: pipx run --spec "bandit[sarif]" bandit -r rpg-api/ -ll -f sarif -o bandit-report.sarif

      - name: Analyse Semgrep (SAST moderne)
        if: always()
        run: pipx run semgrep scan --config auto rpg-api/ --error --sarif --output semgrep-report.sarif

      - name: Upload rapport Bandit vers l'onglet Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4.36.2
        with:
          sarif_file: bandit-report.sarif
          category: bandit

      - name: Upload rapport Semgrep vers l'onglet Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4.36.2
        with:
          sarif_file: semgrep-report.sarif
          category: semgrep

      - name: Upload rapports SAST bruts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sast-reports
          path: |
            bandit-report.sarif
            semgrep-report.sarif

  tests-api:
    runs-on: ubuntu-latest
    steps:
      - name: Téléchargement du code source
        uses: actions/checkout@v7

      - name: Installation de Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Installation des dépendances
        run: pip install -r rpg-api/requirements.txt

      - name: Lancement des tests unitaires
        run: python -m pytest rpg-api/tests/test_app.py -v

  dast-api:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Réveil de l'API Render
        run: |
          curl --retry 5 --retry-delay 10 --retry-connrefused \
            https://rpg-pipeline.onrender.com
          sleep 15

      - name: OWASP ZAP sur l'API Render
        continue-on-error: true
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'https://rpg-pipeline.onrender.com'
          fail_action: false
          artifact_name: 'zap-scan-results'

  dast-api-local:
    needs: build-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Téléchargement du code source
        uses: actions/checkout@v7

      - name: Récupération de l'image de l'API
        uses: actions/download-artifact@v8
        with:
          name: image-rpg-api

      - name: Chargement de l'image
        run: docker load -i rpg-api.tar

      - name: Génération de secrets jetables
        run: |
          {
            echo "API_SECRET_KEY=$(openssl rand -hex 32)"
            echo "ADMIN_USERNAME=zap-$(openssl rand -hex 4)"
            echo "ADMIN_PASSWORD=$(openssl rand -hex 24)"
          } > ci.env

      - name: Lancement de l'API
        run: docker run -d --name rpg-api-pr -p 5000:5000 --env-file ci.env rpg-api:ci

      - name: Attente que l'API réponde
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/actions > /dev/null; then
              echo "API prête après $i essai(s)"
              exit 0
            fi
            sleep 2
          done
          echo "L'API n'a pas répondu en 60 secondes"
          docker logs rpg-api-pr
          exit 1

      - name: Smoke test du conteneur
        run: |
          curl -sf http://localhost:5000/monstres | jq -e 'length > 0'
          docker exec rpg-api-pr python -c "import urllib.request; urllib.request.urlopen('http://localhost:9100')"

      - name: OWASP ZAP sur l'API de la PR
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:5000'
          rules_file_name: '.zap/rules.tsv'
          fail_action: true
          allow_issue_writing: false
          artifact_name: 'zap-scan-local'

      - name: Logs de l'API
        if: always()
        run: docker logs rpg-api-pr || true

  supply-chain-api:
    needs:
      - analyse-code
      - scan-jeu
      - scan-api
      - sast-api
      - tests-api
      - dast-api-local
      - iac-scan-checkov
      - kyverno-policy-test
      - terraform-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Calcul du nom d'image en minuscule
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/rpg-api" >> "$GITHUB_OUTPUT"

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Récupération de l'image testée
        uses: actions/download-artifact@v8
        with:
          name: image-rpg-api

      - name: Chargement de l'image
        run: docker load -i rpg-api.tar

      - name: Publication de l'image API
        id: build
        run: |
          docker tag rpg-api:ci ${{ steps.image.outputs.name }}:${{ github.sha }}
          docker push ${{ steps.image.outputs.name }}:${{ github.sha }} | tee push.log
          DIGEST=$(grep -o 'sha256:[a-f0-9]\{64\}' push.log | tail -1)
          test -n "$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Installation de Syft
        uses: anchore/sbom-action/download-syft@v0.24.0

      - name: Génération du SBOM
        run: |
          syft ${{ steps.image.outputs.name }}:${{ github.sha }} \
            -o spdx-json=sbom-rpg-api.spdx.json \
            -o cyclonedx-json=sbom-rpg-api.cdx.json

      - name: Upload du SBOM en artefact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-rpg-api
          path: sbom-rpg-api.*.json

      - name: Installation de Cosign
        uses: sigstore/cosign-installer@v3

      - name: Signature keyless de l'image (Sigstore)
        run: |
          cosign sign --yes \
            ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}

      - name: Attachement du SBOM à l'image (attestation)
        run: |
          cosign attest --yes \
            --predicate sbom-rpg-api.spdx.json \
            --type spdxjson \
            ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}

      - name: Vérification de la signature
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}

  iac-scan-checkov:
    runs-on: ubuntu-latest
    steps:
      - name: Téléchargement du code source
        uses: actions/checkout@v7

      - name: Installation de Helm
        uses: azure/setup-helm@v5

      - name: Scan Checkov des manifests Kubernetes
        uses: bridgecrewio/checkov-action@v12.3108.0
        with:
          directory: k8s/
          framework: kubernetes
          output_format: cli
          soft_fail: false

      - name: Scan Checkov du chart Helm
        if: always()
        uses: bridgecrewio/checkov-action@v12.3108.0
        with:
          directory: helm/
          framework: helm
          output_format: cli
          soft_fail: false

      - name: Scan Checkov du code Terraform
        if: always()
        uses: bridgecrewio/checkov-action@v12.3108.0
        with:
          directory: terraform/
          framework: terraform
          output_format: cli
          soft_fail: false

  kyverno-policy-test:
    runs-on: ubuntu-latest
    steps:
      - name: Téléchargement du code source
        uses: actions/checkout@v7

      - name: Installation de la CLI Kyverno
        uses: kyverno/action-install-cli@v0.2.0
        with:
          release: 'v1.18.1'

      - name: Test des policies contre les manifests Kubernetes
        run: kyverno apply policies/ --resource k8s/

  terraform-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Téléchargement du code source
        uses: actions/checkout@v7

      - name: Installation de Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: '1.16.2'

      - name: Vérification du formatage
        run: terraform fmt -check -recursive

      - name: Initialisation sans backend
        run: terraform init -backend=false

      - name: Validation de la configuration
        run: terraform validate
