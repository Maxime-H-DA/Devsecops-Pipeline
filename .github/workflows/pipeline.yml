name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  analyse-code:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Téléchargement du code source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Détection de secrets dans le code
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload rapport Gitleaks vers l'onglet Security
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
          category: gitleaks

      - name: Installation de Cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck


      - name: Recherche de bugs dans le code C++
        run: |
          cppcheck \
            --enable=warning,portability \
            --suppress=missingIncludeSystem \
            --error-exitcode=1 \
            rpg-source/

  scan-jeu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Téléchargement du code source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - name: Construction de l'image du jeu
        run: docker build -t rpg-alterdune .

      - name: Scan de vulnérabilités du jeu
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rpg-alterdune
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: 1
          format: sarif
          output: trivy-jeu.sarif

      - name: Upload du rapport vers l'onglet Security
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-jeu.sarif
          category: trivy-jeu

  build-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Téléchargement du code source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - name: Connexion au registre des images durcies Docker
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construction de l'image de l'API
        run: docker build -t rpg-api:ci --build-arg APP_VERSION=${{ github.sha }} -f rpg-api/Dockerfile .

      - name: Export de l'image
        run: docker save rpg-api:ci -o rpg-api.tar

      - name: Partage de l'image avec les autres jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-rpg-api
          path: rpg-api.tar
          retention-days: 1

  scan-api:
    needs: build-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:

      - name: Téléchargement du code source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Récupération de l'image de l'API
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: image-rpg-api

      - name: Chargement de l'image
        run: docker load -i rpg-api.tar

      - name: Scan de vulnérabilités de l'API
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_VEX: .vex/dhi-python-3.14.8-debian13.openvex.json
          TRIVY_IGNOREFILE: .trivyignore.yaml
        with:
          image-ref: rpg-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: 1
          format: sarif
          output: trivy-api.sarif

      - name: Upload du rapport vers l'onglet Security
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api

  sast-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Téléchargement du code source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Analyse Bandit (vulnérabilités Python)
        run: pipx run --spec "bandit[sarif]==1.9.4" bandit -r rpg-api/ -ll -f sarif -o bandit-report.sarif

      - name: Analyse Semgrep (SAST moderne)
        if: always()
        run: pipx run --spec semgrep==1.181.0 semgrep scan --config auto rpg-api/ --error --sarif --output semgrep-report.sarif

      - name: Upload rapport Bandit vers l'onglet Security
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: bandit-report.sarif
          category: bandit

      - name: Upload rapport Semgrep vers l'onglet Security
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: semgrep-report.sarif
          category: semgrep

      - name: Upload rapports SAST bruts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sast-reports
          path: |
            bandit-report.sarif
            semgrep-report.sarif

  tests-api:
    runs-on: ubuntu-latest
    steps:
      - name: Téléchargement du code source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Installation de Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'

      - name: Installation des dépendances
        run: pip install --require-hashes -r rpg-api/requirements-dev.txt

      - name: Lancement des tests unitaires
        run: python -m pytest rpg-api/tests/test_app.py -v --cov=app --cov-fail-under=95

  dast-api:
    needs: supply-chain-api
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Téléchargement du code source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Attente de cette version sur Render
        run: |
          for i in $(seq 1 30); do
            VERSION=$(curl -s --max-time 10 https://rpg-pipeline.onrender.com/version | jq -r '.version' 2>/dev/null || true)
            if [ "$VERSION" = "${{ github.sha }}" ]; then
              echo "Render sert la version $VERSION"
              exit 0
            fi
            sleep 10
          done
          echo "Render ne sert pas la version ${{ github.sha }} après 5 minutes"
          exit 1

      - name: OWASP ZAP sur l'API Render
        continue-on-error: true
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'https://rpg-pipeline.onrender.com'
          rules_file_name: '.zap/rules.tsv'
          fail_action: false
          artifact_name: 'zap-scan-results'

  dast-api-local:
    needs: build-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Téléchargement du code source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Récupération de l'image de l'API
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: image-rpg-api

      - name: Chargement de l'image
        run: docker load -i rpg-api.tar

      - name: Génération de secrets jetables
        run: |
          {
            echo "API_SECRET_KEY=$(openssl rand -hex 32)"
            echo "ADMIN_USERNAME=zap-$(openssl rand -hex 4)"
            echo "ADMIN_PASSWORD=$(openssl rand -hex 24)"
          } > ci.env

      - name: Lancement de l'API
        run: docker run -d --name rpg-api-pr -p 5000:5000 --env-file ci.env rpg-api:ci

      - name: Attente que l'API réponde
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/actions > /dev/null; then
              echo "API prête après $i essai(s)"
              exit 0
            fi
            sleep 2
          done
          echo "L'API n'a pas répondu en 60 secondes"
          docker logs rpg-api-pr
          exit 1

      - name: Smoke test du conteneur
        run: |
          curl -sf http://localhost:5000/monstres | jq -e 'length > 0'
          docker exec rpg-api-pr python -c "import urllib.request; urllib.request.urlopen('http://localhost:9100')"

      - name: OWASP ZAP sur l'API de la PR
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://localhost:5000'
          rules_file_name: '.zap/rules.tsv'
          fail_action: true
          allow_issue_writing: false
          artifact_name: 'zap-scan-local'

      - name: Logs de l'API
        if: always()
        run: docker logs rpg-api-pr || true

  supply-chain-api:
    needs:
      - analyse-code
      - scan-jeu
      - scan-api
      - sast-api
      - tests-api
      - dast-api-local
      - iac-scan-checkov
      - kyverno-policy-test
      - terraform-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Calcul du nom d'image en minuscule
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/rpg-api" >> "$GITHUB_OUTPUT"

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Récupération de l'image testée
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: image-rpg-api

      - name: Chargement de l'image
        run: docker load -i rpg-api.tar

      - name: Publication de l'image API
        id: build
        run: |
          docker tag rpg-api:ci ${{ steps.image.outputs.name }}:${{ github.sha }}
          docker push ${{ steps.image.outputs.name }}:${{ github.sha }} | tee push.log
          DIGEST=$(grep -o 'sha256:[a-f0-9]\{64\}' push.log | tail -1)
          test -n "$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Installation de Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Génération du SBOM
        run: |
          syft ${{ steps.image.outputs.name }}:${{ github.sha }} \
            -o spdx-json=sbom-rpg-api.spdx.json \
            -o cyclonedx-json=sbom-rpg-api.cdx.json

      - name: Upload du SBOM en artefact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom-rpg-api
          path: sbom-rpg-api.*.json

      - name: Installation de Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Signature keyless de l'image (Sigstore)
        run: |
          cosign sign --yes \
            ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}

      - name: Attachement du SBOM à l'image (attestation)
        run: |
          cosign attest --yes \
            --predicate sbom-rpg-api.spdx.json \
            --type spdxjson \
            ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}

      - name: Vérification de la signature
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }} > /dev/null

      - name: Vérification de l'attestation SBOM
        run: |
          cosign verify-attestation \
            --type spdxjson \
            --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }} > /dev/null

      - name: Étiquette main sur l'image signée
        run: |
          docker tag rpg-api:ci ${{ steps.image.outputs.name }}:main
          docker push ${{ steps.image.outputs.name }}:main | tee push-main.log
          DIGEST_MAIN=$(grep -o 'sha256:[a-f0-9]\{64\}' push-main.log | tail -1)
          test "$DIGEST_MAIN" = "${{ steps.build.outputs.digest }}"

      - name: Déploiement sur Render de l'image signée
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          IMAGE="${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"
          IMAGE_ENCODEE=$(jq -rn --arg v "$IMAGE" '$v|@uri')
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}&imgURL=${IMAGE_ENCODEE}" > /dev/null
          echo "Déploiement demandé : $IMAGE"

  iac-scan-checkov:
    runs-on: ubuntu-latest
    steps:
      - name: Téléchargement du code source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Scan Checkov des manifests Kubernetes
        uses: bridgecrewio/checkov-action@6f26dc90000b74feb589a906cdfae540f5119895 # v12.3134.0
        with:
          directory: k8s/
          framework: kubernetes
          output_format: cli
          soft_fail: false

      - name: Scan Checkov du code Terraform
        if: always()
        uses: bridgecrewio/checkov-action@6f26dc90000b74feb589a906cdfae540f5119895 # v12.3134.0
        with:
          directory: terraform/
          framework: terraform
          output_format: cli
          soft_fail: false

  kyverno-policy-test:
    runs-on: ubuntu-latest
    steps:
      - name: Téléchargement du code source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Installation de la CLI Kyverno
        uses: kyverno/action-install-cli@fcee92fca5c883169ef9927acf543e0b5fc58289 # v0.2.0
        with:
          release: 'v1.18.1'

      - name: Tests unitaires des policies
        run: kyverno test policies/tests

      - name: Test des policies contre les manifests Kubernetes
        run: kyverno apply $(ls policies/*.yaml | grep -v verify-rpg-api) --resource k8s/

      - name: Extraction des règles des PrometheusRule
        run: |
          mkdir -p /tmp/alertes
          cp falco/tests/*.test.yaml monitoring/tests/*.test.yaml /tmp/alertes/
          docker run --rm -v "$PWD:/workdir" mikefarah/yq:4.45.1 '.spec' falco/falco-alerts.yaml > /tmp/alertes/falco-alerts.rules.yaml
          docker run --rm -v "$PWD:/workdir" mikefarah/yq:4.45.1 '.spec' monitoring/rpg-api-alerts.yaml > /tmp/alertes/rpg-api-alerts.rules.yaml

      - name: Vérification de la syntaxe des alertes Prometheus
        run: docker run --rm -v /tmp/alertes:/alertes --entrypoint promtool quay.io/prometheus/prometheus:v3.14.0-distroless check rules /alertes/falco-alerts.rules.yaml /alertes/rpg-api-alerts.rules.yaml

      - name: Tests unitaires des alertes Prometheus
        run: docker run --rm -v /tmp/alertes:/alertes --entrypoint promtool quay.io/prometheus/prometheus:v3.14.0-distroless test rules /alertes/falco-alerts.test.yaml /alertes/rpg-api-alerts.test.yaml

  terraform-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Téléchargement du code source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Installation de Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.16.2'

      - name: Vérification du formatage
        run: terraform fmt -check -recursive

      - name: Initialisation sans backend
        run: terraform init -backend=false

      - name: Validation de la configuration
        run: terraform validate
