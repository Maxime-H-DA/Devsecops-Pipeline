apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-rpg-api-signature
spec:
  failurePolicy: Fail
  validationActions: [Deny]
  webhookConfiguration:
    timeoutSeconds: 30
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: rpg-pipeline
  matchImageReferences:
    - glob: "ghcr.io/maxime-h-da/rpg-api*"
  validationConfigurations:
    mutateDigest: true
    verifyDigest: true
    required: true
  attestors:
    - name: pipeline
      cosign:
        keyless:
          identities:
            - subject: "https://github.com/Maxime-H-DA/Devsecops-Pipeline/.github/workflows/pipeline.yml@refs/heads/main"
              issuer: "https://token.actions.githubusercontent.com"
  validations:
    - expression: >-
        images.containers.filter(i, i.startsWith('ghcr.io/maxime-h-da/rpg-api')).map(i, verifyImageSignatures(i, [attestors.pipeline])).all(e, e > 0)
      message: "Image rpg-api non signee par pipeline.yml sur main"
