repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-ll"]

  - repo: https://github.com/semgrep/pre-commit
    rev: 'v1.168.0'
    hooks:
      - id: semgrep
        args: ["--config", "auto", "--error", "--skip-unknown-extensions", "--quiet"]
        exclude: ^(\.github/workflows/|policies/)

  - repo: https://github.com/bridgecrewio/checkov
    rev: '3.3.6'
    hooks:
      - id: checkov
        files: \.ya?ml$
        args: ["--directory", "k8s/", "--framework", "kubernetes", "--compact", "--soft-fail"]
      - id: checkov
        name: checkov (terraform)
        files: \.tf$
        args: ["--directory", "terraform/", "--framework", "terraform", "--compact", "--soft-fail"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^helm/.*/templates/
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: terraform-fmt
        name: terraform fmt
        entry: terraform fmt -check -recursive terraform
        language: system
        files: \.tf$
