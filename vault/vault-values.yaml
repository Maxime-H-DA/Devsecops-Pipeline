injector:
  enabled: true
  webhook:
    failurePolicy: Fail
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: rpg-pipeline
  securityContext:
    container:
      runAsNonRoot: true
      runAsUser: 100
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

server:
  standalone:
    enabled: true
  securityContext:
    container:
      runAsNonRoot: true
      runAsUser: 100
      allowPrivilegeEscalation: false
  auditStorage:
    enabled: true
    size: 1Gi
