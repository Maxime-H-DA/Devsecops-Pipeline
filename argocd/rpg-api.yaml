apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rpg-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
spec:
  project: default
  source:
    repoURL: https://github.com/Maxime-H-DA/Devsecops-Pipeline.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: rpg-pipeline
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
